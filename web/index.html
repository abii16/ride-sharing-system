<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideShare - Future of Mobility</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <nav>
        <a href="index.html" class="logo">
            <div style="background:var(--secondary); width:8px; height:8px; border-radius:50%; margin-right:5px"></div>
            RideShare <span>.</span>
        </a>
        <div class="nav-items">
            
            <a href="pages/auth.html?role=admin">System Admin</a>
        </div>
    </nav>

    <div class="hero">
        <div class="content">
            <h1>Go Anywhere.</h1>
            <br>
            <br>
            
            <div class="cards-container">
                
                <a href="pages/auth.html?role=passenger" class="option-card" style="--color-glow: #4e8cff; --color-bg-icon: rgba(78, 140, 255, 0.2);">
                    <div class="card-icon">👋</div>
                    <div class="card-title">I'm a Passenger</div>

                    <div class="arrow-btn">Book Ride &rarr;</div>
                </a>

                
                <a href="pages/auth.html?role=driver" class="option-card" style="--color-glow: #00ca72; --color-bg-icon: rgba(0, 202, 114, 0.2);">
                    <div class="card-icon">🚘</div>
                    <div class="card-title">I'm a Driver</div>

                    <div class="arrow-btn">Start Driving &rarr;</div>
                </a>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Distributed RideSharing System | Built with &#10084; by softwares
    </footer>

</body>
</html>
