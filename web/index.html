<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideShare - Future of Mobility</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <nav>
        <a href="index.html" class="logo">
            <div style="background:var(--primary); width:8px; height:8px; border-radius:50%; margin-right:5px"></div>
            RideShare<span>.</span>
        </a>
    </nav>

    <div class="hero">
        <div class="content">
            <h1>Go Anywhere.</h1>
            <p class="subtitle" style="margin-bottom: 30px;">A secure, real-time distributed mobility network.</p>
            
            <div class="cards-container" style="justify-content: center;">
                <a href="pages/auth.html" class="option-card" style="width: 360px; --color-glow: #4e8cff; --color-bg-icon: rgba(78, 140, 255, 0.2); padding: 3rem; text-align: center;">
                    <div class="card-icon">⚡</div>
                    <div class="card-title">Gateway Portal</div>
                    <div class="card-desc" style="margin-top: 10px; color: var(--text-main); opacity: 0.7;">

                    </div>
                    <div class="arrow-btn" style="opacity: 1; transform: none; margin-top: 30px; background: var(--primary); color: white; padding: 12px 30px; border-radius: 10px; box-shadow: 0 4px 15px var(--primary-glow); display: inline-block;">
                        Enter Portal &rarr;

            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Distributed RideSharing System | Built with &#10084; by softwares
