<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RideShare - Future of Mobility</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <nav>
        <a href="index.html" class="logo">
            <div style="background:var(--primary); width:8px; height:8px; border-radius:50%; margin-right:5px"></div>
            RideShare<span>.</span>
        </a>
    </nav>

    <div class="hero">
        <div class="content">
            <h1 style="font-size: 5.5rem; margin-bottom: 25px;">Go Anywhere.</h1>
            <p class="hero-desc" style="font-size: 1.35rem; max-width: 620px; margin: 0 auto 40px auto; color: var(--text-sec); line-height: 1.7; font-weight: 300;">
                A real-time distributed mobility network. Access passenger bookings, active driver dispatches, and secure system audits in one integrated portal.
            </p>
            <a href="pages/auth.html" class="enter-portal-btn" style="display: inline-block; background: var(--primary); color: white; text-decoration: none; padding: 18px 45px; font-size: 1.15rem; font-weight: 600; border-radius: 14px; box-shadow: 0 6px 20px rgba(78, 140, 255, 0.3); transition: all 0.3s ease;">
                Enter System Portal &rarr;
            </a>
            
            <style>
                .enter-portal-btn:hover {
                    transform: translateY(-3px);
                    box-shadow: 0 8px 25px rgba(78, 140, 255, 0.5);
                }
                .enter-portal-btn:active {
                    transform: translateY(-1px);
                }
            </style>
        </div>
    </div>

    <footer>
        &copy; 2026 Distributed RideSharing System | Built with &#10084; by softwares
