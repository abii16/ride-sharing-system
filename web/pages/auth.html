<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified Login Gateway - RideShare</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/auth.css">
    <style>
        /* Modern overrides for unified login view */
        .active-login .role-tabs {
            display: none !important;
        }
        .active-login #portalHeading {
            font-size: 2.2rem;
        }
    </style>
</head>
<body class="active-passenger active-login">

    <nav>
        <a href="../index.html" class="logo">
            <div style="background:var(--primary); width:8px; height:8px; border-radius:50%; margin-right:8px;" id="logoDot"></div>
            RideShare<span>.</span>
        </a>
    </nav>

    <div class="container">
        <div class="auth-card">
            
            <div class="auth-header">
                <h2 id="portalHeading">Sign In</h2>
                <p id="portalSubheading">Welcome back! Please enter your credentials to log in.</p>
            </div>

            <!-- Role Tabs (Only visible when signing up) -->
            <div class="role-tabs" id="authRoleTabs" style="display: none;">
                <button class="role-tab active" data-role="PASSENGER" onclick="switchRole('PASSENGER')">👤 Passenger</button>
                <button class="role-tab" data-role="DRIVER" onclick="switchRole('DRIVER')">🚘 Driver</button>
            </div>

            <!-- Mode Selector (Log In / Sign Up) -->
            <div class="mode-toggle" id="modeContainer">
                <span class="mode-link active" id="modeLogin" onclick="switchMode('LOGIN')">LOG IN</span>
                <span class="mode-link" id="modeSignup" onclick="switchMode('SIGNUP')">SIGN UP</span>
            </div>

            <!-- Form -->
            <form id="authForm" onsubmit="event.preventDefault(); handleSubmit();">
                
                <div class="input-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <span class="icon">👤</span>
                        <input type="text" id="username" placeholder="Enter your username" required>
                    </div>
                </div>

                <div class="input-group" id="emailGroup" style="display: none;">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <span class="icon">✉️</span>
                        <input type="email" id="email" placeholder="name@example.com">
                    </div>
                </div>

                <div class="input-group">
                    <label for="password" id="passLabel">Password</label>
                    <div class="input-wrapper">
                        <span class="icon">🔒</span>
                        <input type="password" id="password" placeholder="Enter your password" required style="padding-right: 45px;">
                        <span class="toggle-password" onclick="togglePasswordVisibility('password', this)">👁️</span>
                    </div>
                    <small id="passHelp" style="display: none; color: var(--text-muted); font-size: 0.78rem; margin-top: 6px; line-height: 1.4;">
                        Password must be at least 6 characters and contain an uppercase letter, lowercase letter, number, and special character.
                    </small>
                </div>

                <!-- Driver Only Registration Fields -->
                <div class="driver-only-fields" id="driverFields">
                    <div class="input-group">
                        <label for="model">Vehicle Model</label>
                        <div class="input-wrapper">
                            <span class="icon">🚗</span>
                            <input type="text" id="model" placeholder="e.g. Toyota Corolla">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="plate">License Plate</label>
                        <div class="input-wrapper">
                            <span class="icon">🔢</span>
                            <input type="text" id="plate" placeholder="e.g. AA-12345">
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">LOG IN</button>
            </form>

            <!-- Alert Box -->
            <div id="alertBox" class="alert-box"></div>

        </div>
    </div>

    <footer>
        &copy; 2026 Distributed RideSharing System | Built with &#10084; by softwares
    </footer>

    <script src="../js/auth.js"></script>
</body>
</html>
