<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger Sign Up - RideShare</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/passenger_register.css">
</head>
<body>

    <nav>
        <a href="../index.html" class="logo">🚕<span>RideShare</span></a>
        <a href="passenger.html" class="nav-link">Already have an account? Log In</a>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Passenger Sign Up</h2>
            
            <div id="msgBox" class="alert"></div>

            <form id="regForm" onsubmit="event.preventDefault(); register();">
                <div class="input-group">
                    <label class="label">Username</label>
                    <input type="text" id="username" placeholder="Choose a username" required>
                </div>
                
                <div class="input-group">
                    <label class="label">Password</label>
                    <input type="password" id="password" placeholder="Create a password" required>
                </div>

                <button type="submit" class="btn-primary" id="subBtn">Sign Up</button>
            </form>

            <div class="footer-links">
                By clicking Sign Up, you agree to our Terms and Privacy Policy.
            </div>
        </div>
    </div>

    <script src="../js/passenger_register.js"></script>
</body>
</html>
